services:
  php:
    build:
      context: .
        dockerfile: Dockerfile
    container_name: myapp-php
    volumes:
      - ./src:/var/www/html
  
  nginx:
    image: nginx:alpine
    container_name: myapp-nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php